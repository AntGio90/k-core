version: "3.8"

services:

  cheshire-cat-core:
    build:
      context: ./core
    container_name: cheshire_cat_core
    # Uncomment the two lines below to use your .env (see .env.example)
    # env_file:
    #   - .env
    ports:
      - "${CCAT_CORE_PORT:-1865}:80"
      - "5678:5678" # only for development purposes (take away in production)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${CCAT_TIMEZONE:-CEST-2}
    volumes:
      - ./core:/app
    command:
      - python
      - -m
      - cat.main
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.8
    container_name: ollama_cat
    restart: unless-stopped

    # Publish the TCP port 11434 (or your $OLLAMA_PORT)
    ports:
      - "${OLLAMA_PORT:-11434}:${OLLAMA_PORT:-11434}"

    environment:
      # Host should be just the address (no port)
      OLLAMA_HOST: "0.0.0.0"
      # Ollama may still read this if referenced elsewhere
      OLLAMA_PORT: "${OLLAMA_PORT:-11434}"
      OLLAMA_DEBUG: "${OLLAMA_DEBUG:-false}"
      OLLAMA_FLASH_ATTENTION: "${OLLAMA_FLASH_ATTENTION:-false}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"

    volumes:
      - ./ollama:/root/.ollama

